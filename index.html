<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PassBear - Simple password generator</title>
    
    <!-- SEO & Favicons -->
    <link rel="shortcut icon" type="image/x-icon" href="favicon-32x32.png" />
    <meta name="description" content="PassBear.net - Making password generation easy and secure for better online protection." />
    
    <!-- External CSS (Bootstrap & Icons) -->
    <link rel="stylesheet" href="css/main.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />

    <style>
        /* Custom Pink Theme for Slider Thumbs */
        .form-range::-webkit-slider-thumb { background: #f687b3; }
        .form-range::-moz-range-thumb { background: #f687b3; }
    </style>
</head>

<body class="bg-pink-300 d-flex flex-column min-vh-100">
    
    <!-- Dark Mode Toggle -->
    <header class="position-fixed top-0 end-0 p-3 z-index-10">
        <i id="darkModeToggle" class="bi bi-moon-fill" style="cursor: pointer; font-size: 1.5rem;" aria-label="Toggle Dark Mode"></i>
    </header>

    <main class="flex-grow-1 container d-flex align-items-center justify-content-center">
        <div class="row w-100 justify-content-center">
            
            <!-- Logo Section -->
            <div class="col-md-4 d-flex justify-content-center align-items-center mb-4 mb-md-0">
                <a href="https://passbear.net">
                    <img src="img/passbear_new.png" alt="PassBear Logo" class="img-fluid" style="max-width: 100%; max-height: 400px; object-fit: contain" />
                </a>
            </div>

            <!-- Generator Card -->
            <div class="col-md-4 form-card">
                <form id="password-form">
                    
                    <!-- Result Display -->
                    <div class="mb-3 mt-3">
                        <input type="text" id="generated-password" class="form-control form-control-lg text-center" placeholder="Your password will appear here" readonly />
                    </div>

                    <!-- Range Controls (Min/Max) -->
                    <div class="mb-3">
                        <div class="row g-3">
                            <!-- Minimum Length Slider -->
                            <div class="col-6">
                                <label for="password-length" class="form-label d-flex justify-content-between small mb-1">
                                    Min: <span id="password-length-value" class="fw-bold">12</span>
                                </label>
                                <input type="range" class="form-range" min="12" max="20" step="1" id="password-length" value="12">
                            </div>
                            
                            <!-- Maximum Length Slider -->
                            <div class="col-6">
                                <label for="password-max-length" class="form-label d-flex justify-content-between small mb-1">
                                    Max: <span id="password-max-length-value" class="fw-bold">20</span>
                                </label>
                                <input type="range" class="form-range" min="12" max="20" step="1" id="password-max-length" value="20">
                            </div>
                        </div>
                    </div>

                    <!-- Character Options -->
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="numbers-option" checked />
                        <label class="form-check-label" for="numbers-option">Include Numbers</label>
                    </div>

                    <div class="form-check mt-2">
                        <input class="form-check-input" type="checkbox" id="specialchars-option" checked />
                        <label class="form-check-label" for="specialchars-option">Include Special Characters</label>
                    </div>

                    <!-- Persistence Option -->
                    <div class="form-check mt-2">
                        <input class="form-check-input" type="checkbox" id="save-settings-option" />
                        <label class="form-check-label" for="save-settings-option">Save settings</label>
                    </div>

                    <!-- Live Metadata -->
                    <p class="mt-4 mb-3 small text-muted">
                        Actual password length: <span id="generated-password-length" class="fw-bold">0</span>
                    </p>

                    <!-- Action Buttons -->
                    <button type="button" class="btn btn-primary w-100 mb-2 py-2 fw-bold" id="generate-password">
                        Generate Password
                    </button>
                    
                    <button type="button" class="btn btn-success w-100 py-2 fw-bold" id="copy-to-clipboard">
                        Copy to Clipboard
                    </button>
                    
                </form>
            </div> <!-- End form-card -->
        </div>
    </main>

    <!-- Simple Footer -->
    <footer class="bg-dark text-white py-3 mt-auto">
        <div class="container d-flex justify-content-center align-items-center">
            <small class="text-center">
                &copy; 2026 PassBear - Secure, Simple, Sweet.
            </small>
        </div>
    </footer>

    <!-- Logic (Vite/Module System) -->
    <script type="module" src="/js/script.js"></script>
    
</body>
</html>
