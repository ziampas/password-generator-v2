<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PassBear - Simple password generator</title>
    
    <!-- SEO & Favicons -->
    <link rel="shortcut icon" type="image/x-icon" href="favicon-32x32.png" />
    <meta name="description" content="PassBear.net - Making password generation easy and secure for better online protection." />
    
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />
    
    <style>
        /* Mjuk övergång för e-postlänken */
        .transition-link {
            transition: opacity 0.2s ease-in-out;
        }
    </style>
</head>

<body class="bg-dark d-flex flex-column min-vh-100">

    <!-- Huvudinnehåll centrerat vertikalt i viewporten -->
    <main class="flex-grow-1 d-flex align-items-center py-5">
        <div class="container">
            
            <!-- Övre raden: Logo och Generator -->
            <div class="row justify-content-center align-items-center">
                
                <!-- Logo Section -->
                <div class="col-md-4 d-flex justify-content-center mb-4 mb-md-0">
                    <a href="https://passbear.net">
                        <img src="img/passbear_new.png" alt="PassBear Logo" class="img-fluid" style="max-width: 100%; max-height: 400px; object-fit: contain" />
                    </a>
                </div>

                <!-- Generator Card -->
                <div class="col-md-4">
                    <div class="p-4 bg-white shadow-sm rounded-4">
                        <form id="password-form">
                            <!-- Result Display -->
                            <div class="mb-3 mt-2">
                                <input type="text" id="generated-password" class="form-control form-control-lg text-center" placeholder="Your password will appear here" />
                            </div>

                            <!-- Length Sliders -->
                            <div class="mb-3">
                                <div class="row g-3">
                                    <div class="col-6">
                                        <label for="password-length" class="form-label d-flex justify-content-between small mb-1">
                                            Min: <span id="password-length-value" class="fw-bold">12</span>
                                        </label>
                                        <input type="range" class="form-range" min="12" max="20" step="1" id="password-length" value="12">
                                    </div>
                                    <div class="col-6">
                                        <label for="password-max-length" class="form-label d-flex justify-content-between small mb-1">
                                            Max: <span id="password-max-length-value" class="fw-bold">20</span>
                                        </label>
                                        <input type="range" class="form-range" min="12" max="20" step="1" id="password-max-length" value="20">
                                    </div>
                                </div>
                            </div>

                            <!-- Options Grid -->
                            <div class="row g-2 mb-2">
                                <div class="col-6 text-nowrap">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="numbers-option" checked />
                                        <label class="form-check-label small" for="numbers-option">Numbers</label>
                                    </div>
                                </div>
                                <div class="col-6 text-nowrap">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="specialchars-option" checked />
                                        <label class="form-check-label small" for="specialchars-option">Symbols</label>
                                    </div>
                                </div>
                                <div class="col-6 text-nowrap">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="capitalize-option" checked />
                                        <label class="form-check-label small" for="capitalize-option">Capitalize</label>
                                    </div>
                                </div>
                                <div class="col-6 text-nowrap">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="dash-option" />
                                        <label class="form-check-label small" for="dash-option">Dashes (-)</label>
                                    </div>
                                </div>
                            </div>

                            <!-- Persistent Settings -->
                            <div class="form-check mt-3 pt-2 border-top">
                                <input class="form-check-input" type="checkbox" id="save-settings-option" />
                                <label class="form-check-label small" for="save-settings-option">Save settings</label>
                            </div>

                            <p class="mt-2 mb-3 small text-muted">
                                Length: <span id="generated-password-length" class="fw-bold">0</span>
                            </p>

                            <!-- Actions -->
                            <button type="button" class="btn btn-primary w-100 mb-2 py-2 fw-bold" id="generate-password">Generate Password</button>
                            <button type="button" class="btn btn-success w-100 py-2 fw-bold" id="copy-to-clipboard">Copy to Clipboard</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Undre raden: Minimalist Info (Med extra gap mt-5) -->
            <div class="row justify-content-center mt-5">
                <div class="col-md-8 text-center text-white-50">
                    <div class="mb-2">
                        <i class="bi bi-lock fs-4 opacity-50"></i>
                    </div>
                    <p class="small fw-light mb-0">
                        <span class="text-white fw-bold text-uppercase" style="letter-spacing: 1px;">Memorable. Secure. Private.</span><br>
                        Passwords for humans, generated in-browser. Zero tracking.
                    </p>
                </div>
            </div>
            
        </div>
    </main>

    <!-- Footer låst i botten via mt-auto -->
    <footer class="text-white-50 py-4 mt-auto">
        <div class="container border-top border-secondary pt-3" style="--bs-border-opacity: .2;">
            <div class="d-md-flex justify-content-between align-items-center small">
                <!-- Copyright Section -->
                <div class="mb-2 mb-md-0 opacity-50">
                    &copy; 2026 PassBear | Simple & Secure
                </div>
                
                <!-- Email Section -->
                <div>
                    <a href="mailto:hello@passbear.net" class="link-light link-opacity-50 link-opacity-100-hover text-decoration-none transition-link">
                        <i class="bi bi-envelope me-1"></i> hello@passbear.net
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Your Custom Logic -->
    <script type="module" src="/js/script.js"></script>
</body>
</html>
