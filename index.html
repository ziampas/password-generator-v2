<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PassBear | Secure & Memorable Password Generator</title>

    <!-- Meta Tags -->
    <meta name="description" content="Generate secure, memorable passwords locally in your browser." />
    <link rel="canonical" href="https://passbear.net" />
    <link rel="shortcut icon" type="image/x-icon" href="favicon-32x32.png" />

    <!-- External Assets -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />

    <style>
        .transition-link {
            transition: opacity 0.2s ease-in-out;
        }

        body {
            overflow-x: hidden;
            background-color: #212529;
        }

        .generator-card {
            border: none;
            transition: transform 0.2s ease;
        }
    </style>
</head>

<body class="bg-dark d-flex flex-column min-vh-100">

    <main class="flex-grow-1 d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center align-items-center">

                <!-- Brand Section -->
                <div class="col-md-4 d-flex justify-content-center mb-5 mb-md-0">
                    <a href="https://passbear.net">
                        <img src="img/passbear_new.png" alt="PassBear Logo" class="img-fluid" style="max-height: 400px; object-fit: contain" />
                    </a>
                </div>

                <!-- Generator Interface -->
                <div class="col-md-4">
                    <div class="p-5 bg-white shadow-sm rounded-4 generator-card">
                        <form id="password-form">
                            <div class="mb-3 mt-2">
                                <input type="text" id="generated-password" class="form-control form-control-lg text-center fw-bold bg-light" placeholder="Your password" aria-label="Generated Password" readonly />
                            </div>

                            <div class="mb-3">
                                <div class="row g-3">
                                    <div class="col-6">
                                        <label for="password-length" class="form-label d-flex justify-content-between small mb-1">
                                            Min: <span id="password-length-value" class="fw-bold">12</span>
                                        </label>
                                        <input type="range" class="form-range" min="12" max="20" step="1" id="password-length" value="12">
                                    </div>
                                    <div class="col-6">
                                        <label for="password-max-length" class="form-label d-flex justify-content-between small mb-1">
                                            Max: <span id="password-max-length-value" class="fw-bold">20</span>
                                        </label>
                                        <input type="range" class="form-range" min="12" max="20" step="1" id="password-max-length" value="20">
                                    </div>
                                </div>
                            </div>

                            <div class="row g-2 mb-2">
                                <div class="col-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="numbers-option" checked />
                                        <label class="form-check-label small" for="numbers-option">Numbers</label>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="specialchars-option" checked />
                                        <label class="form-check-label small" for="specialchars-option">Symbols</label>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="capitalize-option" checked />
                                        <label class="form-check-label small" for="capitalize-option">Capitalize</label>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="dash-option" />
                                        <label class="form-check-label small" for="dash-option">Dashes (-)</label>
                                    </div>
                                </div>
                            </div>

                            <p class="mt-2 mb-3 small text-muted text-center">
                                Length: <span id="generated-password-length" class="fw-bold text-dark">0</span> characters
                            </p>

                            <div class="d-grid gap-2">
                                <button type="button" class="btn btn-primary rounded-pill py-2 fw-bold border-0 shadow-sm" id="generate-password">
                                    <i class="bi bi-arrow-clockwise me-1"></i> Generate
                                </button>
                                <button type="button" class="btn btn-success rounded-pill py-2 fw-bold border-0 shadow-sm" id="copy-to-clipboard">
                                    <i class="bi bi-clipboard me-1"></i> Copy
                                </button>
                            </div>

                            <div class="form-check mt-3 pt-2 border-top border-light">
                                <input class="form-check-input" type="checkbox" id="save-settings-option" />
                                <label class="form-check-label small text-muted" for="save-settings-option" style="font-size: 0.75rem;">Remember my settings</label>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="text-white-50 py-4 mt-auto">
        <div class="container border-top border-secondary pt-3" style="--bs-border-opacity: .2;">
            <div class="d-md-flex justify-content-between align-items-center small text-center text-md-start">
                <div class="mb-2 mb-md-0 opacity-50">
                    &copy; 2026 PassBear | Simple & Secure Password Generator
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/script.js"></script>
</body>
</html>
