<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PassBear - Simple password generator</title>

    <!-- SEO & Favicons -->
    <link rel="shortcut icon" type="image/x-icon" href="favicon-32x32.png" />
    <meta name="description" content="PassBear.net - Making password generation easy and secure for better online protection." />

    <!-- Bootstrap 5 CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />
</head>

<body class="bg-dark d-flex flex-column min-vh-100">

    <main class="flex-grow-1 container d-flex align-items-center justify-content-center">
        <div class="row w-100 justify-content-center">

            <!-- Logo Section -->
            <div class="col-md-4 d-flex justify-content-center align-items-center mb-4 mb-md-0">
                <a href="https://passbear.net">
                    <img src="img/passbear_new.png" alt="PassBear Logo" class="img-fluid" style="max-width: 100%; max-height: 400px; object-fit: contain" />
                </a>
            </div>

            <!-- Generator Card -->
            <div class="col-md-4 p-4 bg-white shadow-sm rounded-4">
                <form id="password-form">

                    <!-- Result Display -->
                    <div class="mb-3 mt-3">
                        <input type="text" id="generated-password" class="form-control form-control-lg text-center" placeholder="Your password will appear here" />
                    </div>

                    <!-- Range Controls (Min/Max) -->
                    <div class="mb-3">
                        <div class="row g-3">
                            <div class="col-6">
                                <label for="password-length" class="form-label d-flex justify-content-between small mb-1">
                                    Min: <span id="password-length-value" class="fw-bold">12</span>
                                </label>
                                <input type="range" class="form-range" min="12" max="20" step="1" id="password-length" value="12">
                            </div>

                            <div class="col-6">
                                <label for="password-max-length" class="form-label d-flex justify-content-between small mb-1">
                                    Max: <span id="password-max-length-value" class="fw-bold">20</span>
                                </label>
                                <input type="range" class="form-range" min="12" max="20" step="1" id="password-max-length" value="20">
                            </div>
                        </div>
                    </div>

                    <!-- Character & Formatting Options (2x2 Grid) -->
                    <div class="row g-2 mb-2">
                        <div class="col-6">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="numbers-option" checked />
                                <label class="form-check-label small" for="numbers-option">Include Numbers</label>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="specialchars-option" checked />
                                <label class="form-check-label small" for="specialchars-option">Include Symbols</label>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="capitalize-option" checked />
                                <label class="form-check-label small" for="capitalize-option">Capitalize Words</label>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="dash-option" />
                                <label class="form-check-label small" for="dash-option">Dashes (-)</label>
                            </div>
                        </div>
                    </div>

                    <!-- Save Settings -->
                    <div class="form-check mt-3 pt-2 border-top">
                        <input class="form-check-input" type="checkbox" id="save-settings-option" />
                        <label class="form-check-label small" for="save-settings-option">Save settings</label>
                    </div>

                    <p class="mt-3 mb-3 small text-muted">
                        Password length: <span id="generated-password-length" class="fw-bold">0</span>
                    </p>

                    <button type="button" class="btn btn-primary w-100 mb-2 py-2 fw-bold" id="generate-password">
                        Generate Password
                    </button>

                    <button type="button" class="btn btn-success w-100 py-2 fw-bold" id="copy-to-clipboard">
                        Copy to Clipboard
                    </button>

                </form>
            </div>
        </div>
    </main>

    <!-- Final Minimalist Section -->
    <section class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center text-white-50">
                <div class="mb-2">
                    <i class="bi bi-shield-lock fs-1"></i>
                </div>
                <p class="small fw-light mb-0">
                    <span class="text-white fw-bold text-uppercase" style="letter-spacing: 1px;">
                        Memorable. Secure. Private.
                    </span><br>
                    Passwords made for humans, generated only in your browser.
                </p>
            </div>
        </div>
    </section>

    <footer class="text-white-50 py-4 mt-auto">
        <div class="container border-top border-secondary pt-3" style="--bs-border-opacity: .2;">
            <div class="d-md-flex justify-content-between align-items-center small">
                <!-- Copyright -->
                <div class="mb-2 mb-md-0 opacity-50">
                    &copy; 2026 PassBear | Simple & Secure
                </div>

                <!-- Email -->
                <div>
                    <a href="mailto:hello@passbear.net" class="link-light link-opacity-50 link-opacity-100-hover text-decoration-none">
                        <i class="bi bi-envelope me-1"></i> hello@passbear.net
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/script.js"></script>

</body>
</html>
