<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PassBear | Secure & Memorable Password Generator</title>

    <!-- Favicons & Technical Meta -->
    <link rel="shortcut icon" type="image/x-icon" href="./assets/favicon-32x32-B0DaedZ2.png" />
    <link rel="canonical" href="https://passbear.net" />
    <meta name="description" content="Generate secure, memorable passwords locally in your browser." />

    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />

    <style>
        /* Smooth transition for the email link hover */
        .transition-link {
            transition: opacity 0.2s ease-in-out;
        }
        /* Prevents horizontal scroll on small devices */
        body {
            overflow-x: hidden;
        }
    </style>
  <script type="module" crossorigin src="./assets/index-BlNzsNyE.js"></script>
</head>

<body class="bg-dark d-flex flex-column min-vh-100">

    <!-- Main Content Area: Grows to push footer down -->
    <main class="flex-grow-1 d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center align-items-center">
                
                <!-- Left Column: Logo -->
                <div class="col-md-4 d-flex justify-content-center mb-5 mb-md-0">
                    <a href="https://passbear.net">
                        <img src="./assets/passbear_new-CrsOKCPQ.png" alt="PassBear Logo" class="img-fluid" style="max-width: 100%; max-height: 400px; object-fit: contain" />
                    </a>
                </div>

                <!-- Right Column: Generator Card -->
                <div class="col-md-4">
                    <div class="p-4 bg-white shadow-sm rounded-4">
                        <form id="password-form">
                            <!-- Result Display -->
                            <div class="mb-3 mt-2">
                                <input type="text" id="generated-password" class="form-control form-control-lg text-center fw-bold" placeholder="Your password" aria-label="Generated Password" />
                            </div>

                            <!-- Length Sliders -->
                            <div class="mb-3">
                                <div class="row g-3">
                                    <div class="col-6">
                                        <label for="password-length" class="form-label d-flex justify-content-between small mb-1">
                                            Min: <span id="password-length-value" class="fw-bold">12</span>
                                        </label>
                                        <input type="range" class="form-range" min="12" max="20" step="1" id="password-length" value="12">
                                    </div>
                                    <div class="col-6">
                                        <label for="password-max-length" class="form-label d-flex justify-content-between small mb-1">
                                            Max: <span id="password-max-length-value" class="fw-bold">20</span>
                                        </label>
                                        <input type="range" class="form-range" min="12" max="20" step="1" id="password-max-length" value="20">
                                    </div>
                                </div>
                            </div>

                            <!-- Password Options -->
                            <div class="row g-2 mb-2">
                                <div class="col-6 text-nowrap">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="numbers-option" checked />
                                        <label class="form-check-label small" for="numbers-option">Numbers</label>
                                    </div>
                                </div>
                                <div class="col-6 text-nowrap">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="specialchars-option" checked />
                                        <label class="form-check-label small" for="specialchars-option">Symbols</label>
                                    </div>
                                </div>
                                <div class="col-6 text-nowrap">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="capitalize-option" checked />
                                        <label class="form-check-label small" for="capitalize-option">Capitalize</label>
                                    </div>
                                </div>
                                <div class="col-6 text-nowrap">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="dash-option" />
                                        <label class="form-check-label small" for="dash-option">Dashes (-)</label>
                                    </div>
                                </div>
                            </div>

                            <!-- Persistence Setting -->
                            <div class="form-check mt-3 pt-2 border-top">
                                <input class="form-check-input" type="checkbox" id="save-settings-option" />
                                <label class="form-check-label small" for="save-settings-option">Save settings</label>
                            </div>

                            <!-- Dynamic Character Count -->
                            <p class="mt-2 mb-3 small text-muted">
                                Length: <span id="generated-password-length" class="fw-bold">0</span> characters
                            </p>

                            <!-- Primary Action Buttons -->
                            <button type="button" class="btn btn-primary w-100 mb-2 py-2 fw-bold" id="generate-password">
                                <i class="bi bi-arrow-clockwise me-1"></i> Generate Password
                            </button>
                            <button type="button" class="btn btn-success w-100 py-2 fw-bold" id="copy-to-clipboard">
                                <i class="bi bi-clipboard me-1"></i> Copy to Clipboard
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer: Stayed at bottom via d-flex flex-column and mt-auto -->
    <footer class="text-white-50 py-4 mt-auto">
        <div class="container border-top border-secondary pt-3" style="--bs-border-opacity: .2;">
            <div class="d-md-flex justify-content-between align-items-center small">
                <div class="mb-2 mb-md-0 opacity-50">
                    &copy; 2026 PassBear | Simple & Secure Password Generator
                </div>
                <div>
                    <a href="mailto:hello@passbear.net" class="link-light link-opacity-50 link-opacity-100-hover text-decoration-none transition-link">
                        <i class="bi bi-envelope me-1"></i> hello@passbear.net
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Main Logic -->
</body>
</html>
